<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Property Details</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    margin:0;
}

.hero{
    height:500px;
    background:url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=1600');
    background-size:cover;
    background-position:center;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:25px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
}

.price{
    color:#0d6efd;
    font-size:36px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="hero"></div>

<div class="container">

<div class="card" id="details">

Loading...

</div>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const id = params.get("id");

async function loadProperty() {

    const response =
    await fetch(
      `https://aqar-production-b2a2.up.railway.app/api/properties/${id}`
    );

    const data = await response.json();

    const property = data.property;

    document.getElementById("details").innerHTML = `
        <div class="price">
         ${property.price}
        </div>

        <h1>${property.title}</h1>

        <p>${property.description}</p>

        <hr>

        <p><b>Country:</b> ${property.country}</p>
        <p><b>City:</b> ${property.city}</p>
        <p><b>Type:</b> ${property.property_type}</p>
        <p><b>Bedrooms:</b> ${property.bedrooms}</p>
        <p><b>Bathrooms:</b> ${property.bathrooms}</p>
    `;
}

loadProperty();

</script>

</body>
</html>
