<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Dashboard</title>

<style>

body{
    font-family:Arial;
    background:#f5f7fa;
    padding:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.box{
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
}

.number{
    font-size:40px;
    color:#0d6efd;
}

</style>
</head>

<body>

<h1>Aqar Dashboard</h1>

<div class="grid">

<div class="box">
<div id="users" class="number">0</div>
Users
</div>

<div class="box">
<div id="properties" class="number">0</div>
Properties
</div>

<div class="box">
<div id="favorites" class="number">0</div>
Favorites
</div>

</div>

<script>

async function loadStats() {

    const response =
    await fetch(
      "https://aqar-production-b2a2.up.railway.app/api/dashboard"
    );

    const data = await response.json();

    document.getElementById("users").innerText =
    data.stats.total_users;

    document.getElementById("properties").innerText =
    data.stats.total_properties;

    document.getElementById("favorites").innerText =
    data.stats.total_favorites;
}

loadStats();

</script>

</body>
</html>
