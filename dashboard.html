<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<style>
body{
    font-family:Arial, Tahoma, sans-serif;
    background:#f5f7fa;
    padding:30px;
}
h1{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
}
.header-right{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
    font-weight:normal;
    color:#666;
}
#refreshBtn, #langBtn{
    background:#0d6efd;
    color:white;
    border:none;
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-family:inherit;
}
#langBtn{
    background:#495057;
}
#langBtn:hover{
    background:#343a40;
}
#refreshBtn:hover{
    background:#0b5ed7;
}
#refreshBtn:disabled{
    background:#9dbdf5;
    cursor:not-allowed;
}
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-top:20px;
}
.box{
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
    position:relative;
}
.number{
    font-size:40px;
    color:#0d6efd;
    min-height:48px;
}
.skeleton{
    display:inline-block;
    width:60px;
    height:40px;
    background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);
    background-size:200% 100%;
    animation:shimmer 1.2s infinite;
    border-radius:6px;
    vertical-align:middle;
}
@keyframes shimmer{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
}
.error-banner{
    background:#fdecea;
    color:#b3261e;
    border:1px solid #f5c2c0;
    padding:14px 18px;
    border-radius:10px;
    margin-top:20px;
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}
.error-banner button{
    background:#b3261e;
    color:white;
    border:none;
    padding:6px 14px;
    border-radius:6px;
    cursor:pointer;
    font-family:inherit;
}
.chart-card{
    background:white;
    padding:30px;
    border-radius:12px;
    margin-top:20px;
}
.chart-card h2{
    margin-top:0;
    font-size:18px;
    color:#333;
}
.bar-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin:14px 0;
}
.bar-label{
    width:90px;
    font-size:14px;
    color:#555;
}
.bar-track{
    flex:1;
    background:#eef1f6;
    border-radius:6px;
    overflow:hidden;
    height:22px;
}
.bar-fill{
    height:100%;
    background:#0d6efd;
    width:0%;
    transition:width 0.6s ease;
    border-radius:6px;
}
.bar-value{
    width:50px;
    text-align:right;
    font-size:14px;
    color:#333;
    font-weight:bold;
}
html[dir="rtl"] .bar-value{
    text-align:left;
}
</style>
</head>
<body>

<h1>
  <span id="titleText">Aqar Dashboard</span>
  <span class="header-right">
    <span id="lastUpdated">Loading...</span>
    <button id="refreshBtn" onclick="loadStats()">Refresh</button>
    <button id="langBtn" onclick="toggleLanguage()">العربية</button>
  </span>
</h1>

<div id="errorBanner" class="error-banner">
  <span id="errorText">Something went wrong loading the dashboard.</span>
  <button onclick="loadStats()" id="retryBtn">Try again</button>
</div>

<div class="grid">
  <div class="box">
    <div id="properties" class="number"><span class="skeleton"></span></div>
    <span id="propertiesLabel">Properties</span>
  </div>
  <div class="box">
    <div id="favorites" class="number"><span class="skeleton"></span></div>
    <span id="favoritesLabel">Favorites</span>
  </div>
</div>

<div class="chart-card">
  <h2 id="overviewTitle">Overview</h2>
  <div class="bar-row">
    <div class="bar-label" id="bar-properties-label">Properties</div>
    <div class="bar-track"><div id="bar-properties" class="bar-fill"></div></div>
    <div id="bar-properties-val" class="bar-value">0</div>
  </div>
  <div class="bar-row">
    <div class="bar-label" id="bar-favorites-label">Favorites</div>
    <div class="bar-track"><div id="bar-favorites" class="bar-fill"></div></div>
    <div id="bar-favorites-val" class="bar-value">0</div>
  </div>
</div>

<script>
const API_URL = "https://aqar-production-b2a2.up.railway.app/api/dashboard";
const refreshBtn = document.getElementById("refreshBtn");
const errorBanner = document.getElementById("errorBanner");
const errorText = document.getElementById("errorText");
const lastUpdated = document.getElementById("lastUpdated");
const htmlRoot = document.getElementById("htmlRoot");

const translations = {
    en: {
        title: "Aqar Dashboard",
        refresh: "Refresh",
        refreshing: "Refreshing...",
        langBtn: "العربية",
        properties: "Properties",
        favorites: "Favorites",
        overview: "Overview",
        retry: "Try again",
        loading: "Loading...",
        updateFailed: "Update failed",
        updatedPrefix: "Updated ",
        errorPrefix: "Couldn't load dashboard data: "
    },
    ar: {
        title: "لوحة تحكم عقار",
        refresh: "تحديث",
        refreshing: "جارٍ التحديث...",
        langBtn: "English",
        properties: "العقارات",
        favorites: "المفضلة",
        overview: "نظرة عامة",
        retry: "إعادة المحاولة",
        loading: "جارٍ التحميل...",
        updateFailed: "فشل التحديث",
        updatedPrefix: "آخر تحديث ",
        errorPrefix: "تعذر تحميل بيانات اللوحة: "
    }
};

let currentLang = localStorage.getItem("aqar_lang") || "en";
let lastStats = null;

function applyLanguage(){
    const t = translations[currentLang];
    document.getElementById("titleText").innerText = t.title;
    document.getElementById("langBtn").innerText = t.langBtn;
    document.getElementById("propertiesLabel").innerText = t.properties;
    document.getElementById("favoritesLabel").innerText = t.favorites;
    document.getElementById("overviewTitle").innerText = t.overview;
    document.getElementById("bar-properties-label").innerText = t.properties;
    document.getElementById("bar-favorites-label").innerText = t.favorites;
    document.getElementById("retryBtn").innerText = t.retry;
    refreshBtn.innerText = t.refresh;

    htmlRoot.setAttribute("lang", currentLang);
    htmlRoot.setAttribute("dir", currentLang === "ar" ? "rtl" : "ltr");

    if (lastStats){
        lastUpdated.innerText = t.updatedPrefix + lastStats.time;
    } else if (!errorBanner.style.display || errorBanner.style.display === "none"){
        lastUpdated.innerText = t.loading;
    }
}

function toggleLanguage(){
    currentLang = currentLang === "en" ? "ar" : "en";
    localStorage.setItem("aqar_lang", currentLang);
    applyLanguage();
}

function showSkeletons(){
    document.getElementById("properties").innerHTML = '<span class="skeleton"></span>';
    document.getElementById("favorites").innerHTML = '<span class="skeleton"></span>';
}

function setBar(id, value, max){
    const pct = max > 0 ? Math.round((value / max) * 100) : 0;
    document.getElementById("bar-" + id).style.width = pct + "%";
    document.getElementById("bar-" + id + "-val").innerText = value;
}

function formatTime(){
    const now = new Date();
    return now.toLocaleTimeString();
}

async function loadStats() {
    const t = translations[currentLang];
    errorBanner.style.display = "none";
    refreshBtn.disabled = true;
    refreshBtn.innerText = t.refreshing;
    showSkeletons();

    const token = localStorage.getItem("aqar_token");

    if (!token) {
        window.location.href = "login.html";
        return;
    }

    try {
        const response = await fetch(API_URL, {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        if (response.status === 401) {
            localStorage.removeItem("aqar_token");
            localStorage.removeItem("aqar_user");
            window.location.href = "login.html";
            return;
        }

        if (!response.ok) {
            throw new Error("Server returned status " + response.status);
        }

        const data = await response.json();

        if (!data || !data.stats) {
            throw new Error("Unexpected response from server");
        }

        const properties = data.stats.total_properties ?? 0;
        const favorites = data.stats.total_favorites ?? 0;

        document.getElementById("properties").innerText = properties;
        document.getElementById("favorites").innerText = favorites;

        const max = Math.max(properties, favorites, 1);
        setBar("properties", properties, max);
        setBar("favorites", favorites, max);

        lastStats = { time: formatTime() };
        lastUpdated.innerText = t.updatedPrefix + lastStats.time;

    } catch (err) {
        errorText.innerText = t.errorPrefix + err.message;
        errorBanner.style.display = "flex";
        document.getElementById("properties").innerText = "—";
        document.getElementById("favorites").innerText = "—";
        lastUpdated.innerText = t.updateFailed;
    } finally {
        refreshBtn.disabled = false;
        refreshBtn.innerText = t.refresh;
    }
}

applyLanguage();
loadStats();
</script>
</body>
</html>
