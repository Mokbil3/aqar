<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<style>
body{
    font-family:Arial, Tahoma, sans-serif;
    background:#f5f7fa;
    padding:30px;
}
h1{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
}
.header-right{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
    font-weight:normal;
    color:#666;
}
#refreshBtn, #langBtn{
    background:#0d6efd;
    color:white;
    border:none;
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-family:inherit;
}
#langBtn{
    background:#495057;
}
#langBtn:hover{
    background:#343a40;
}
#refreshBtn:hover{
    background:#0b5ed7;
}
#refreshBtn:disabled{
    background:#9dbdf5;
    cursor:not-allowed;
}
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-top:20px;
}
.box{
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
    position:relative;
}
.number{
    font-size:40px;
    color:#0d6efd;
    min-height:48px;
}

    display:inline-block;
    width:60px;
