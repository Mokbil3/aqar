<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<style>
body{
    font-family:Arial;
    background:#f5f7fa;
    padding:30px;
}
h1{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
}
.header-right{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
    font-weight:normal;
    color:#666;
}
#refreshBtn{
    background:#0d6efd;
    color:white;
    border:none;
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
}
#refreshBtn:hover{
    background:#0b5ed7;
}
#refreshBtn:disabled{
    background:#9dbdf5;
    cursor:not-allowed;
}
.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:20px;
}
.box{
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
    position:relative;
}
.number{
    font-size:40px;
    color:#0d6efd;
    min-height:48px;
}
.skeleton{
    display:inline-block;
    width:60px;
    height:40px;
    background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);
    background-size:200% 100%;
    animation:shimmer 1.2s infinite;
    border-radius:6px;
    vertical-align:middle;
}
@keyframes shimmer{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
}
.error-banner{
    background:#fdecea;
    color:#b3261e;
    border:1px solid #f5c2c0;
    padding:14px 18px;
    border-radius:10px;
    margin-top:20px;
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}
.error-banner button{
    background:#b3261e;
    color:white;
    border:none;
    padding:6px 14px;
    border-radius:6px;
    cursor:pointer;
}
.chart-card{
    background:white;
    padding:30px;
    border-radius:12px;
    margin-top:20px;
}
.chart-card h2{
    margin-top:0;
    font-size:18px;
    color:#333;
}
.bar-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin:14px 0;
}
.bar-label{
    width:90px;
    font-size:14px;
    color:#555;
}
.bar-track{
    flex:1;
    background:#eef1f6;
    border-radius:6px;
    overflow:hidden;
    height:22px;
}
.bar-fill{
    height:100%;
    background:#0d6efd;
    width:0%;
    transition:width 0.6s ease;
    border-radius:6px;
}
.bar-value{
    width:50px;
    text-align:right;
    font-size:14px;
    color:#333;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>
  Aqar Dashboard
  <span class="header-right">
    <span id="lastUpdated">Loading...</span>
    <button id="refreshBtn" onclick="loadStats()">Refresh</button>
  </span>
</h1>

<div id="errorBanner" class="error-banner">
  <span id="errorText">Something went wrong loading the dashboard.</span>
  <button onclick="loadStats()">Try again</button>
</div>

<div class="grid">
  <div class="box">
    <div id="users" class="number"><span class="skeleton"></span></div>
    Users
  </div>
  <div class="box">
    <div id="properties" class="number"><span class="skeleton"></span></div>
    Properties
  </div>
  <div class="box">
    <div id="favorites" class="number"><span class="skeleton"></span></div>
    Favorites
  </div>
</div>

<div class="chart-card">
  <h2>Overview</h2>
  <div class="bar-row">
    <div class="bar-label">Users</div>
    <div class="bar-track"><div id="bar-users" class="bar-fill"></div></div>
    <div id="bar-users-val" class="bar-value">0</div>
  </div>
  <div class="bar-row">
    <div class="bar-label">Properties</div>
    <div class="bar-track"><div id="bar-properties" class="bar-fill"></div></div>
    <div id="bar-properties-val" class="bar-value">0</div>
  </div>
  <div class="bar-row">
    <div class="bar-label">Favorites</div>
    <div class="bar-track"><div id="bar-favorites" class="bar-fill"></div></div>
    <div id="bar-favorites-val" class="bar-value">0</div>
  </div>
</div>

<script>
const API_URL = "https://aqar-production-b2a2.up.railway.app/api/dashboard";
const refreshBtn = document.getElementById("refreshBtn");
const errorBanner = document.getElementById("errorBanner");
const errorText = document.getElementById("errorText");
const lastUpdated = document.getElementById("lastUpdated");

function showSkeletons(){
    document.getElementById("users").innerHTML = '<span class="skeleton"></span>';
    document.getElementById("properties").innerHTML = '<span class="skeleton"></span>';
    document.getElementById("favorites").innerHTML = '<span class="skeleton"></span>';
}

function setBar(id, value, max){
    const pct = max > 0 ? Math.round((value / max) * 100) : 0;
    document.getElementById("bar-" + id).style.width = pct + "%";
    document.getElementById("bar-" + id + "-val").innerText = value;
}

function formatTime(){
    const now = new Date();
    return "Updated " + now.toLocaleTimeString();
}

async function loadStats() {
    errorBanner.style.display = "none";
    refreshBtn.disabled = true;
    refreshBtn.innerText = "Refreshing...";
    showSkeletons();

    try {
        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Server returned status " + response.status);
        }

        const data = await response.json();

        if (!data || !data.stats) {
            throw new Error("Unexpected response from server");
        }

        const users = data.stats.total_users ?? 0;
        const properties = data.stats.total_properties ?? 0;
        const favorites = data.stats.total_favorites ?? 0;

        document.getElementById("users").innerText = users;
        document.getElementById("properties").innerText = properties;
        document.getElementById("favorites").innerText = favorites;

        const max = Math.max(users, properties, favorites, 1);
        setBar("users", users, max);
        setBar("properties", properties, max);
        setBar("favorites", favorites, max);

        lastUpdated.innerText = formatTime();

    } catch (err) {
        errorText.innerText = "Couldn't load dashboard data: " + err.message;
        errorBanner.style.display = "flex";
        document.getElementById("users").innerText = "—";
        document.getElementById("properties").innerText = "—";
        document.getElementById("favorites").innerText = "—";
        lastUpdated.innerText = "Update failed";
    } finally {
        refreshBtn.disabled = false;
        refreshBtn.innerText = "Refresh";
    }
}

loadStats();
</script>
</body>
</html>
