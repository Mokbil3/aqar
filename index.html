<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عقار فور اول</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF6EE;--border:#E6DAC4;--teal:#0E6B57;--clay:#C1602F;--card:#fff;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);margin:0;}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px;}
header{background:#fff;border-bottom:1px solid var(--border);padding:12px 0;position:sticky;top:0;z-index:100;}
.nav{display:flex;justify-content:space-between;align-items:center;}
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;}.btn-teal{background:var(--teal);color:#fff;}.btn-clay{background:var(--clay);color:#fff;}
.search{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:10px;margin:20px 0;}
select,input{border:1px solid var(--border);border-radius:10px;padding:11px;width:100%;font-family:inherit;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
.card-top{height:120px;background:linear-gradient(135deg,#0E6B57,#1aa385);padding:12px;color:#fff;display:flex;justify-content:space-between;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px;}.modal{background:#fff;border-radius:16px;padding:22px;max-width:560px;width:100%;}
#adminPanel{display:none;background:#fff;border:2px solid var(--teal);border-radius:16px;padding:20px;margin:20px 0;}
.admin-card{background:#FFFBEB;border:1px solid #F3E5AB;border-radius:12px;padding:14px;margin-bottom:10px;}
</style>
</head>
<body>
<header><div class="wrap nav">
<div style="display:flex;gap:10px;align-items:center;font-weight:800;"><div style="width:36px;height:36px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:10px;">ع</div><div>عقار فور اول</div></div>
<div style="display:flex;gap:8px;">
<button onclick="toggleLang()" id="langBtn" style="border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;">English</button>
<a href="?admin=1" style="border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:999px;padding:6px 12px;text-decoration:none;font-size:13px;">Admin</a>
<button class="btn btn-teal" onclick="openModal()">أضف عقارك</button>
</div></div></header>
<div class="wrap">
<div id="adminPanel"><h2>🔧 لوحة التحكم - بانتظار الموافقة</h2><div id="adminList"></div><button onclick="hideAdmin()" class="btn" style="background:#eee;">إغلاق</button></div>
<div class="search">
<div><select id="f-loc" onchange="updateCities('f-loc','f-city');filterProperties();"><option value="">كل الدول</option>
<option value="United Arab Emirates">🇦🇪 الإمارات - UAE</option>
<option value="Saudi Arabia">🇸🇦 السعودية - Saudi Arabia</option>
<option value="Egypt">🇪🇬 مصر - Egypt</option>
<option value="Qatar">🇶🇦 قطر - Qatar</option>
<option value="Kuwait">🇰🇼 الكويت - Kuwait</option>
<option value="Bahrain">🇧🇭 البحرين - Bahrain</option>
<option value="Oman">🇴🇲 عمان - Oman</option>
<option value="Jordan">🇯🇴 الأردن - Jordan</option>
<option value="Lebanon">🇱🇧 لبنان - Lebanon</option>
<option value="Morocco">🇲🇦 المغرب - Morocco</option>
<option value="United States">🇺🇸 أمريكا - USA</option>
<option value="United Kingdom">🇬🇧 بريطانيا - UK</option>
<option value="Germany">🇩🇪 ألمانيا - Germany</option>
<option value="France">🇫🇷 فرنسا - France</option>
<option value="Turkey">🇹🇷 تركيا - Turkey</option>
</select></div>
<div><select id="f-city" style="display:none" onchange="filterProperties()"></select><input id="f-city-input" style="display:none" placeholder="المدينة"></div>
<div><select id="f-type" onchange="filterProperties()"><option value="">كل الأنواع</option><option>شقة</option><option>فيلا</option><option>أرض</option></select></div>
<div><button class="btn btn-clay" style="height:44px;width:100%" onclick="filterProperties()">بحث</button></div>
</div>
<div class="grid" id="propertiesGrid"></div>
</div>
<div id="overlay"><div class="modal">
<div style="display:flex;justify-content:space-between"><h3>أضف عقارك</h3><button onclick="closeModal()">✕</button></div>
<form style="display:grid;gap:10px;margin-top:14px" onsubmit="submitProperty(event)">
<input required id="p-title" placeholder="عنوان الاعلان">
<select required id="p-type"><option value="">نوع العقار</option><option>شقة</option><option>فيلا</option><option>أرض</option></select>
<select id="s-loc" required onchange="updateCities('s-loc','s-city')"><option value="">اختر الدولة</option>
<option value="United Arab Emirates">🇦🇪 الإمارات - UAE</option>
<option value="Saudi Arabia">🇸🇦 السعودية - Saudi Arabia</option>
<option value="Egypt">🇪🇬 مصر - Egypt</option>
<option value="Qatar">🇶🇦 قطر - Qatar</option>
<option value="Kuwait">🇰🇼 الكويت - Kuwait</option>
<option value="Bahrain">🇧🇭 البحرين - Bahrain</option>
<option value="Oman">🇴🇲 عمان - Oman</option>
</select>
<select id="s-city" style="display:none"></select><input id="s-city-input" style="display:none" placeholder="المدينة">
<input required id="s-price" placeholder="السعر"><input required id="s-phone" placeholder="واتساب">
<button class="btn btn-teal" type="submit" style="width:100%">إرسال للمراجعة</button>
</form>
</div></div>
<script>
const citiesByCountry={"United Arab Emirates":["دبي - Dubai","أبوظبي - Abu Dhabi","الشارقة - Sharjah","عجمان - Ajman","رأس الخيمة - RAK"],"Saudi Arabia":["الرياض - Riyadh","جدة - Jeddah","مكة - Mecca","المدينة - Medina"],"Egypt":["القاهرة - Cairo","الإسكندرية - Alexandria","التجمع الخامس - New Cairo"],"Qatar":["الدوحة - Doha","الوكرة - Al Wakrah"],"Kuwait":["مدينة الكويت - Kuwait City","حولي - Hawally"]};
function updateCities(cId,cityId){const c=document.getElementById(cId).value;const sel=document.getElementById(cityId);const inp=document.getElementById(cityId+'-input');sel.innerHTML='<option value="">اختر المدينة</option>';if(citiesByCountry[c]){citiesByCountry[c].forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);});sel.style.display='block';if(inp)inp.style.display='none';}else if(c){sel.style.display='none';if(inp){inp.style.display='block';inp.placeholder='اكتب المدينة في '+c;}}}
let allProperties=JSON.parse(localStorage.getItem('approved_properties')||'[]');if(allProperties.length===0){allProperties=[{id:1,title:"شقة 150م",type:"شقة",country:"Egypt",city:"القاهرة - Cairo",price:"3,200,000 جنيه"}];}
function renderProperties(list){const g=document.getElementById('propertiesGrid');g.innerHTML='';list.forEach(p=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="card-top"><span>${p.type}</span><span>✅</span></div><div style="padding:14px"><b>${p.price}</b><br>${p.title}<br><small>📍 ${p.country} - ${p.city}</small></div>`;g.appendChild(d);});}
function filterProperties(){let c=document.getElementById('f-loc').value;let city=document.getElementById('f-city').value||document.getElementById('f-city-input').value;let t=document.getElementById('f-type').value;let f=allProperties;if(c)f=f.filter(p=>p.country===c);if(city)f=f.filter(p=>p.city.includes(city));if(t)f=f.filter(p=>p.type===t);renderProperties(f);}
function submitProperty(e){e.preventDefault();let title=document.getElementById('p-title').value;let type=document.getElementById('p-type').value;let country=document.getElementById('s-loc').value;let city=document.getElementById('s-city').value||document.getElementById('s-city-input').value;let price=document.getElementById('s-price').value;let phone=document.getElementById('s-phone').value;let pending=JSON.parse(localStorage.getItem('pending_properties')||'[]');pending.push({id:Date.now(),title,type,country,city,price,phone,date:new Date().toLocaleString('ar-EG')});localStorage.setItem('pending_properties',JSON.stringify(pending));alert('تم الإرسال! افتح?admin=1');closeModal();e.target.reset();}
function openModal(){document.getElementById('overlay').style.display='flex';}function closeModal(){document.getElementById('overlay').style.display='none';}
function toggleLang(){let b=document.getElementById('langBtn');if(document.documentElement.dir==='rtl'){document.documentElement.dir='ltr';b.textContent='العربية';}else{document.documentElement.dir='rtl';b.textContent='English';}}
function checkAdmin(){if(window.location.search.includes('admin=1')){document.getElementById('adminPanel').style.display='block';loadAdmin();}}
function loadAdmin(){let pending=JSON.parse(localStorage.getItem('pending_properties')||'[]');let div=document.getElementById('adminList');if(pending.length===0){div.innerHTML='<p>لا يوجد معلق</p>';return;}div.innerHTML='';pending.forEach(p=>{let d=document.createElement('div');d.className='admin-card';d.innerHTML=`<b>${p.title}</b><br>${p.price} - ${p.country} - ${p.city}<br><button class="btn btn-teal" onclick="approveAd(${p.id})">موافقة</button> <button class="btn btn-clay" onclick="rejectAd(${p.id})">رفض</button>`;div.appendChild(d);});}
function approveAd(id){let pending=JSON.parse(localStorage.getItem('pending_properties')||'[]');let ad=pending.find(p=>p.id===id);let approved=JSON.parse(localStorage.getItem('approved_properties')||'[]');approved.push(ad);localStorage.setItem('approved_properties',JSON.stringify(approved));pending=pending.filter(p=>p.id!==id);localStorage.setItem('pending_properties',JSON.stringify(pending));allProperties=approved;renderProperties(allProperties);loadAdmin();}
function rejectAd(id){let pending=JSON.parse(localStorage.getItem('pending_properties')||'[]');pending=pending.filter(p=>p.id!==id);localStorage.setItem('pending_properties',JSON.stringify(pending));loadAdmin();}
function hideAdmin(){document.getElementById('adminPanel').style.display='none';history.pushState({},'',window.location.pathname);}
renderProperties(allProperties);checkAdmin();
</script>
</body>
</html>
