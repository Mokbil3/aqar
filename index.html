<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عقار فور اول | Aqar For All - كل الدول</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FAF6EE;--bg-alt:#F1E7D6;--ink:#232A22;--ink-soft:#666F5F;--teal:#0E6B57;--teal-dark:#0A5245;--clay:#C1602F;--card:#FFFFFF;--border:#E6DAC4;--radius:16px;}
  *{box-sizing:border-box;margin:0;padding:0;} html{scroll-behavior:smooth;} body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;} button{font-family:inherit;cursor:pointer;}
  header{position:sticky;top:0;z-index:50;background:rgba(250,246,238,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
  .logo{display:flex;align-items:center;gap:10px;} .logo-mark{width:38px;height:38px;border-radius:10px;background:var(--teal);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;}
  .logo-text .ar{font-weight:800;font-size:17px;} .logo-text .en{font-size:11px;color:var(--ink-soft);}
  nav.links{display:flex;gap:28px;font-weight:500;color:var(--ink-soft);} .cta-btn{background:var(--teal);color:#fff;border:none;padding:11px 22px;border-radius:999px;font-weight:700;}
  .search-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-top:20px;display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:12px;box-shadow:0 18px 40px rgba(35,42,34,.06);}
  .field{display:flex;flex-direction:column;gap:6px;} .field label{font-size:12.5px;color:var(--ink-soft);font-weight:700;}
  .field select,.field input{border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-family:inherit;font-size:14.5px;background:var(--bg);width:100%;}
  .search-btn{background:var(--clay);color:#fff;border:none;border-radius:10px;padding:0 26px;height:44px;font-weight:700;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:20px;} .card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
  .card-photo{aspect-ratio:16/11;display:flex;justify-content:space-between;padding:14px;background:linear-gradient(135deg,#0E6B57,#12876E);} .badge{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;} .badge.sale{background:var(--teal);} .badge.rent{background:var(--clay);}
  .card-body{padding:16px;} .hidden{display:none!important;}
  @media(max-width:880px){.search-panel{grid-template-columns:1fr 1fr;} .grid{grid-template-columns:1fr 1fr;} nav.links{display:none;}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="logo"><div class="logo-mark">ع</div><div><div class="ar">عقار فور اول</div><div class="en">AQAR FOR ALL</div></div></div><nav class="links"><a href="#">العقارات</a><a href="#">أضف عقارك</a></nav><button class="cta-btn" onclick="openSubmitModal()">أضف عقارك</button></div></header>
<div class="wrap">
<div class="search-panel">
<div class="field"><label>الدولة - All Countries</label>
<select id="f-loc">
<option value="">اختر الدولة - 194 دولة</option>
</select></div>
<div class="field"><label>نوع العقار</label><select id="f-type"><option value="">كل الأنواع</option><option value="شقة">شقة</option><option value="فيلا">فيلا</option><option value="أرض">أرض</option></select></div>
<div class="field"><label>الغرض</label><select id="f-purpose"><option value="">بيع أو إيجار</option><option value="sale">للبيع</option><option value="rent">للإيجار</option></select></div>
<button class="search-btn" onclick="runSearch()">بحث</button>
</div>
<div class="grid" id="listing-grid">
<div class="card" data-type="شقة" data-purpose="sale" data-loc="مصر"><div class="card-photo"><span class="badge sale">للبيع</span></div><div class="card-body"><b>3,200,000 جنيه</b><br>شقة 150م - التجمع الخامس<br>📍 مصر</div></div>
</div>
</div>
<script>
function runSearch(){ const loc=document.getElementById('f-loc').value; alert('بحث عن: '+(loc||'كل الدول')); }
function openSubmitModal(){ document.getElementById('submit-overlay').style.display='flex'; }
function closeSubmitModal(){ document.getElementById('submit-overlay').style.display='none'; }
</script>
</body></html>
