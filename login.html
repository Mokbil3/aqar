<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aqar Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    background:white;
    width:420px;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.logo{
    text-align:center;
    color:#0d6efd;
    font-size:36px;
    font-weight:bold;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#0d6efd;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.success{
    color:green;
}

.error{
    color:red;
}

.footer{
    text-align:center;
    margin-top:20px;
}

.footer a{
    color:#0d6efd;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">
Aqar
</div>

<div class="subtitle">
Login to your account
</div>

<form id="loginForm">

<div class="form-group">
<label>Email</label>
<input
type="email"
id="email"
placeholder="Enter email"
required
>
</div>

<div class="form-group">
<label>Password</label>
<input
type="password"
id="password"
placeholder="Enter password"
required
>
</div>

<button type="submit">
Login
</button>

</form>

<div id="message" class="message"></div>

<div class="footer">

</div>

</div>
