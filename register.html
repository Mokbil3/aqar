<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aqar Register</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.register-card{
    background:white;
    width:450px;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.logo{
    text-align:center;
    font-size:36px;
    font-weight:bold;
    color:#0d6efd;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#0d6efd;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:.9;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.success{
    color:green;
}

.error{
    color:red;
}

.footer{
    text-align:center;
    margin-top:20px;
}

.footer a{
    text-decoration:none;
    color:#0d6efd;
}

</style>

</head>

<body>

<div class="register-card">

<div class="logo">Aqar</div>

<div class="subtitle">
Create Your Account
</div>

<form id="registerForm">

<div class="form-group">

<label>Full Name</label>

<input
type="text"
id="full_name"
placeholder="Enter your full name"
required>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Create a password"
required>

</div>

<button type="submit">
Create Account
</button>

</form>

<div id="message" class="message"></div>

<div class="footer">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<script>

const API_URL =
"https://aqar-production-b2a2.up.railway.app/api/auth/register";

document
.getElementById("registerForm")
.addEventListener("submit", async (e) => {

    e.preventDefault();

    const full_name =
    document.getElementById("full_name").value;

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    const message =
    document.getElementById("message");

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                full_name,
                email,
                password
            })

        });

        const data = await response.json();

        if(data.success){

            message.className =
            "message success";

            message.innerHTML =
            "Registration Successful";

            document
            .getElementById("registerForm")
            .reset();

            setTimeout(() => {
                window.location =
                "login.html";
            }, 2000);

        }else{

            message.className =
            "message error";

            message.innerHTML =
            data.message ||
            "Registration failed";

        }

    }
    catch(error){

        console.error(error);

        message.className =
        "message error";

        message.innerHTML =
        "Unable to connect to server";

    }

});

</script>

</body>

</html>
