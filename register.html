<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register - Aqar</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f7fa;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:40px;
width:450px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
margin-top:12px;
border:1px solid #ddd;
border-radius:8px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
background:#0d6efd;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}
</style>

</head>
<body>

<div class="card">

<h2>Create Account</h2>

<input type="text" placeholder="Full Name">
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">

<button>Register</button>

</div>

</body>
</html>
