<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Aqar Properties</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    margin:0;
}

header{
    background:#0d6efd;
    color:white;
    padding:20px;
}

.grid{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.content{
    padding:15px;
}

.price{
    font-size:24px;
    font-weight:bold;
    color:#0d6efd;
}

a{
    text-decoration:none;
    color:inherit;
}
</style>

</head>
<body>

<header>
<h2>Aqar Properties</h2>
</header>

<div id="properties" class="grid"></div>

<script>

const API =
"https://aqar-production-b2a2.up.railway.app/api/properties";

async function loadProperties() {

    const response = await fetch(API);
    const data = await response.json();

    const container =
    document.getElementById("properties");

    container.innerHTML = "";

    data.properties.forEach(property => {

        container.innerHTML += `
        <a href="property-details.html?id=${property.id}">
            <div class="card">

                <img src="https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=1000">

                <div class="content">

                    <div class="price">
                        ${property.price}
                    </div>

                    <h3>${property.title}</h3>

                    <p>${property.city}, ${property.country}</p>

                </div>
            </div>
        </a>
        `;
    });
}

loadProperties();

</script>

</body>
</html>
