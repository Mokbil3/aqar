<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Properties | Aqar</title>

    <link rel="stylesheet" href="css/properties.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo">Aqar</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="properties.html">Properties</a>
            <span id="nav-auth"></span>
        </nav>
    </header>

    <section class="page-header">
        <h1>Find your next property</h1>
        <p>Browse listings for sale and for rent across the UAE</p>
    </section>

    <section class="filter-bar">
        <select id="filter-purpose">
            <option value="">Sale or rent</option>
            <option value="sale">For sale</option>
            <option value="rent">For rent</option>
        </select>

        <input type="text" id="filter-city" placeholder="City (e.g. Dubai)">

        <input type="number" id="filter-min-price" placeholder="Min price">
        <input type="number" id="filter-max-price" placeholder="Max price">

        <input type="number" id="filter-bedrooms" placeholder="Min bedrooms">

        <button id="filter-apply" class="btn btn-primary">Search</button>
        <button id="filter-clear" class="btn btn-outline">Clear</button>
    </section>

    <main class="listing-grid" id="listing-grid">
        <p class="listing-status">Loading properties…</p>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Aqar. All rights reserved.</p>
        <div class="footer-social">
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            <a href="#" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        </div>
    </footer>

    <script src="js/nav-auth.js" defer></script>
    <script src="js/properties.js" defer></script>

</body>
</html>
