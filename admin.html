<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - Admin</title>
<style>
body{font-family:'Tajawal',sans-serif;background:#FAF6EE;padding:20px;}
.card{background:#fff;border:1px solid #E6DAC4;border-radius:12px;padding:16px;margin-bottom:12px;}
.btn{border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;}
.approve{background:#0E6B57;color:#fff;} .reject{background:#C1602F;color:#fff;}
</style>
</head>
<body>
<h1>🔧 لوحة تحكم الإعلانات - بانتظار الموافقة</h1>
<p>هنا تظهر كل الإعلانات الجديدة التي تحتاج موافقة</p>
<div id="list"></div>
<script>
function loadPending(){
  const pending = JSON.parse(localStorage.getItem('pending_properties') || '[]');
  const list = document.getElementById('list');
  if(pending.length===0){ list.innerHTML='<p>لا يوجد إعلانات معلقة حالياً</p>'; return; }
  list.innerHTML='';
  pending.forEach(p=>{
    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`
      <b>${p.title}</b><br>
      💰 ${p.price}<br>
      📍 ${p.country} - ${p.city}<br>
      🕒 ${p.date}<br>
      <span style="background:#FFF3CD;padding:3px 8px;border-radius:99px;">⏳ بانتظار الموافقة</span><br><br>
      <button class="btn approve" onclick="approveAd(${p.id})">✅ موافقة ونشر</button>
      <button class="btn reject" onclick="rejectAd(${p.id})">❌ رفض</button>
    `;
    list.appendChild(div);
  });
}
function approveAd(id){
  let pending=JSON.parse(localStorage.getItem('pending_properties')||'[]');
  const ad = pending.find(p=>p.id===id);
  let approved=JSON.parse(localStorage.getItem('approved_properties')||'[]');
  approved.push({...ad, status:'approved'});
  localStorage.setItem('approved_properties', JSON.stringify(approved));
  pending=pending.filter(p=>p.id!==id);
  localStorage.setItem('pending_properties', JSON.stringify(pending));
  alert('تمت الموافقة ونشر الإعلان! ✅\nالآن سيظهر في الصفحة الرئيسية');
  loadPending();
}
function rejectAd(id){
  if(!confirm('متأكد تريد رفض الإعلان؟')) return;
  let pending=JSON.parse(localStorage.getItem('pending_properties')||'[]');
  pending=pending.filter(p=>p.id!==id);
  localStorage.setItem('pending_properties', JSON.stringify(pending));
  loadPending();
}
loadPending();
</script>
</body>
</html>
