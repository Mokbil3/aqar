<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List a Property | Aqar</title>

    <link rel="stylesheet" href="css/add-property.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo">Aqar</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="properties.html">Properties</a>
            <span id="nav-auth"></span>
        </nav>
    </header>

    <main class="form-page">
        <h1>List your property</h1>
        <p class="form-subtitle">Fill in the details below — it'll appear on Aqar right away.</p>

        <form id="propertyForm">

            <section class="form-section">
                <h2>Basics</h2>

                <div class="form-group">
                    <label for="title_en">Title</label>
                    <input type="text" id="title_en" placeholder="e.g. Marina Promenade 2BR" required>
                </div>

                <div class="form-group">
                    <label for="description_en">Description</label>
                    <textarea id="description_en" rows="4" placeholder="Describe the property…"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="property_type_id">Property type</label>
                        <select id="property_type_id" required>
                            <option value="">Loading…</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="purpose">Purpose</label>
                        <select id="purpose" required>
                            <option value="sale">For sale</option>
                            <option value="rent">For rent</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2>Location</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city_id">City</label>
                        <select id="city_id" required>
                            <option value="">Loading…</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="district_id">District</label>
                        <select id="district_id" required disabled>
                            <option value="">Select a city first</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="neighborhood_id">Neighborhood</label>
                    <select id="neighborhood_id" required disabled>
                        <option value="">Select a district first</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="Street / building / area details">
                </div>
            </section>

            <section class="form-section">
                <h2>Details</h2>

                <div class="form-row form-row-4">
                    <div class="form-group">
                        <label for="price">Price (AED)</label>
                        <input type="number" id="price" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="bedrooms">Bedrooms</label>
                        <input type="number" id="bedrooms" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="bathrooms">Bathrooms</label>
                        <input type="number" id="bathrooms" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="parking_spaces">Parking</label>
                        <input type="number" id="parking_spaces" min="0" value="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="area">Area (sq ft)</label>
                        <input type="number" id="area" min="0">
                    </div>
                    <div class="form-group">
                        <label for="year_built">Year built</label>
                        <input type="number" id="year_built" min="1900" max="2100">
                    </div>
                </div>

                <div class="form-group form-check">
                    <input type="checkbox" id="furnished">
                    <label for="furnished">Furnished</label>
                </div>
            </section>

            <section class="form-section">
                <h2>Amenities</h2>
                <div class="features-grid" id="features-grid">
                    <p>Loading amenities…</p>
                </div>
            </section>

            <section class="form-section">
                <h2>Photos</h2>
                <div class="form-group">
                    <label for="image_urls">Image URLs (one per line, first one becomes the main photo)</label>
                    <textarea id="image_urls" rows="3" placeholder="https://example.com/photo1.jpg"></textarea>
                    <p class="form-hint">Direct photo uploads are coming soon — for now, paste links to images hosted elsewhere.</p>
                </div>
            </section>

            <button type="submit" class="btn btn-primary" id="submit-btn">Publish listing</button>
            <div id="message" class="message"></div>

        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Aqar. All rights reserved.</p>
    </footer>

    <script src="js/nav-auth.js" defer></script>
    <script src="js/add-property.js" defer></script>

</body>
</html>
